<div class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Configuration Panel -->
    <div class="bg-white rounded-xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Configure Embed</h2>
      
      <div class="flex flex-col sm:flex-row gap-4 mb-4">
        <input 
          type="url" 
          [ngModel]="newUrl()" 
          (ngModelChange)="newUrl.set($event)"
          placeholder="Enter embed URL (e.g., QuickSight dashboard URL)"
          class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 transition-colors"
        />
        <button 
          (click)="updateEmbedUrl()" 
          class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200"
        >
          Update
        </button>
        <button 
          (click)="resetToDefault()" 
          class="px-6 py-3 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200"
        >
          Reset
        </button>
      </div>


      

    </div>

    <!-- Embed Section -->
    <div class="bg-white rounded-xl shadow-2xl p-8 text-center">
      <h1 class="text-3xl font-bold text-blue-600 mb-6">{{ embedConfig().title }}</h1>
      

      
      <div class="mb-6 rounded-lg overflow-hidden shadow-lg">
        <iframe 
          [src]="embedConfig().url | safe" 
          [width]="embedConfig().width"
          [height]="embedConfig().height"
          frameborder="0"
          allowfullscreen
          class="w-full"
        >
        </iframe>
      </div>
      
      <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
        <p class="text-sm text-gray-600 mb-1">Current URL: {{ embedConfig().url }}</p>
        <p class="text-sm text-gray-600">Dimensions: {{ embedConfig().width }} × {{ embedConfig().height }}</p>
      </div>
    </div>
  </div>
</div>
